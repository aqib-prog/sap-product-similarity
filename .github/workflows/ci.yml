name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t product-similarity .
      - name: Start the container
        run: docker run -d --name ps -p 8000:8000 product-similarity
      - name: Wait until the service is ready
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ps
          exit 1
      - name: Request similar products
        run: |
          curl -fsS "http://localhost:8000/find_similar_products?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=5" \
            | python3 -c "import json, sys; ids = json.load(sys.stdin); assert len(ids) == 5 and len(set(ids)) == 5, ids; print(ids)"
      - name: Show a readable example
        run: |
          curl -fsS "http://localhost:8000/find_similar_products/details?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=5" \
            | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          q = r['query']
          print('Question: similar to', q['title'][:70], '|', q['category'], '|', q['price'])
          for x in r['results']:
              print(f\"  {x['score']:.3f}  {x['title'][:60]}  [{x['category']}, {x['price']}]\")
          print('Response time:', r['response_time_ms'], 'ms')
          assert len(r['results']) == 5 and all(x['title'] for x in r['results'])
          "
      - name: Unknown product returns 404
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/find_similar_products?product_id=00000000000000000000000000000000&num_similar=5")
          test "$code" = "404"
      - name: Container runs as a non-root user
        run: test "$(docker exec ps id -u)" != "0"
      - name: Show logs on failure
        if: failure()
        run: docker logs ps
