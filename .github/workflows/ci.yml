name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" faiss-cpu==1.13.0
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: "Scan the packages of the service for known vulnerabilities (pip-audit, warning only)"
        run: |
          python -m pip install pip-audit
          if pip-audit -r requirements.txt; then
            echo "pip-audit found no known vulnerabilities"
          else
            echo "::warning title=pip-audit::Known vulnerabilities were found in the packages of the service. The table is in the log. This does not stop the pipeline."
          fi

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t product-similarity .
      - name: Start the container
        run: docker run -d --name ps -p 8000:8000 product-similarity
      - name: Wait until the service is ready
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ps
          exit 1
      - name: Check that the container runs the final search
        run: |
          curl -fsS http://localhost:8000/ready \
            | python3 -c "import json, sys; r = json.load(sys.stdin); assert r['search'].startswith('hybrid'), r; print(r)"
      - name: "Request 1 - first time, the answer is searched (cache miss)"
        run: |
          curl -fsS -D headers.txt -o ids.json "http://localhost:8000/find_similar_products?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=5"
          python3 -c "import json; ids = json.load(open('ids.json')); assert len(ids) == 5 and len(set(ids)) == 5, ids; print(ids)"
          grep -i '^x-cache' headers.txt
          grep -qi '^x-cache: miss' headers.txt
          echo "Request 1: X-Cache is miss, as expected for a new question"
      - name: "Request 2 - same question again, answered from the cache (cache hit)"
        run: |
          curl -fsS -D headers.txt -o ids_again.json "http://localhost:8000/find_similar_products?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=5"
          grep -i '^x-cache' headers.txt
          grep -qi '^x-cache: hit' headers.txt
          cmp ids.json ids_again.json
          echo "Request 2: X-Cache is hit, and the answer is identical to request 1"
      - name: "Request 3 - same question on the details endpoint (cache hit)"
        run: |
          curl -fsS "http://localhost:8000/find_similar_products/details?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=5" > response.json
          python3 -m json.tool response.json
          python3 -c "
          import json
          r = json.load(open('response.json'))
          assert len(r['results']) == 5 and all(x['title'] for x in r['results'])
          assert r['question']['num_similar'] == 5 and r['response_time_ms'] >= 0
          assert r['cached'] is True
          print('Request 3: cached is', r['cached'], 'and the response time is', r['response_time_ms'], 'ms')
          "
      - name: "Cache statistics - 2 hits and 1 miss"
        run: |
          curl -fsS http://localhost:8000/cache \
            | python3 -c "import json, sys; s = json.load(sys.stdin); print(s); assert s['enabled'] and s['hits'] == 2 and s['misses'] == 1 and s['entries'] == 1, s"
      - name: "Options - one product, five different settings"
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          root = "http://localhost:8000"
          product = "26d41bdc1495de290bc8e6062d927729"
          count = 7  # not 5, so these searches are new and not answers cached by the earlier steps


          def get(path):
              with urllib.request.urlopen(root + path) as response:
                  return json.load(response)


          def search(mode=None, weights=None):
              extra = (f"&mode={mode}" if mode else "") + (f"&weights={weights}" if weights else "")
              return get(f"/find_similar_products/details?product_id={product}&num_similar={count}{extra}")


          ready = get("/ready")
          assert ready["fast_ready"] is True, ready
          tuned = get("/weights")["tuned_weights"]["simple"]
          friendly = {"title": "title", "text_vectors": "sentence", "image": "picture", "attributes": "other attributes"}
          mix = ", ".join(f"{friendly[name]} {value:.0%}" for name, value in tuned.items())

          first = search()
          print("OPTIONS - one product, five different settings")
          print("Product searched:", first["query"]["title"][:90])
          print(f"Each search asks for the {count} most similar products.")
          print("(Not 5, so these are new searches and not answers cached by the steps above.)")

          settings = [
              (
                  "normal search, no extra settings",
                  {},
                  f"exact mode, tuned mix ({mix})",
              ),
              (
                  "same, but fast mode            (mode=fast)",
                  {"mode": "fast"},
                  "the fast index finds the candidates, then the same mix scores them",
              ),
              (
                  "looks only at the picture      (weights=image:1)",
                  {"weights": "image:1"},
                  "only picture similarity counts",
              ),
              (
                  "looks only at the title        (weights=title:1)",
                  {"weights": "title:1"},
                  "only the words of the title count",
              ),
              (
                  "half sentence, half picture    (weights=text_vectors:0.5,image:0.5)",
                  {"weights": "text_vectors:0.5,image:0.5"},
                  "title meaning and picture count equally",
              ),
          ]

          answers = []
          for number, (label, options, meaning) in enumerate(settings, start=1):
              body = first if number == 1 else search(**options)
              answers.append(body)
              kind = "answer from the cache" if body["cached"] else "new search"
              print()
              print(f"SEARCH {number} - {label}")
              print("  What it does :", meaning)
              print(f"  Time         : {body['response_time_ms']} ms   ({kind})")
              for place, item in enumerate(body["results"][:3], start=1):
                  lead = "  Top 3        : " if place == 1 else "                 "
                  print(f"{lead}{place}. {item['title'][:70]}")

          top3 = [[item["id"] for item in body["results"][:3]] for body in answers]
          print()
          print("SUMMARY")
          print(" #  Setting            Mode ran   Time        Top 3 shared with search 1")
          names = ["normal", "fast mode", "picture only", "title only", "sentence+picture"]
          for number, (name, body) in enumerate(zip(names, answers), start=1):
              shared = "-" if number == 1 else f"{len(set(top3[0]) & set(top3[number - 1]))} of 3"
              print(f" {number}  {name:<17}  {body['mode']:<9}  {body['response_time_ms']:>7} ms   {shared}")

          assert answers[1]["mode"] == "fast", answers[1]["mode"]
          ids = [[item["id"] for item in body["results"]] for body in answers]
          assert ids[2] != ids[3] and ids[2] != ids[4] and ids[3] != ids[4], "weights changed nothing"
          print()
          print("CHECKS")
          print(" OK  the fast mode really ran as fast")
          print(" OK  picture only, title only and the mix give 3 different lists")
          print("     -> the weights really change the answer")
          print("Note: the times come from a shared CI machine, so they are only a rough idea.")
          PY
      - name: "Bad input gives clear errors (422)"
        run: |
          id=26d41bdc1495de290bc8e6062d927729
          check() {
            code=$(curl -s -o body.json -w "%{http_code}" "$1")
            echo "$1 -> $code $(cat body.json)"
            test "$code" = "422"
          }
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=0"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5000"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=many"
          check "http://localhost:8000/find_similar_products?product_id=abc&num_similar=5"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5&mode=turbo"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5&weights=image:2"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5&weights=speed:1"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5&weights=attributes:0.5,brand:0.5"
      - name: Unknown product returns 404
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/find_similar_products?product_id=00000000000000000000000000000000&num_similar=5")
          test "$code" = "404"
      - name: "Metrics - the numbers that Prometheus reads"
        run: |
          python3 - <<'PY'
          import urllib.request

          with urllib.request.urlopen("http://localhost:8000/metrics") as response:
              text = response.read().decode()

          def number(name, **labels):
              """One value from the page (0 when that series does not exist)."""
              total = 0.0
              for line in text.splitlines():
                  if line.startswith("#") or not line.startswith(name + "{"):
                      continue
                  series, _, value = line.rpartition(" ")
                  found = dict(part.split("=") for part in series[len(name) + 1 : -1].split(","))
                  if all(found.get(k) == f'"{v}"' for k, v in labels.items()):
                      total += float(value)
              return total

          print("SEARCHES")
          for mode in ("exact", "fast"):
              for cache in ("miss", "hit"):
                  print(f"  {mode:<6} {cache:<5}", int(number("ps_searches_total", mode=mode, cache=cache)))
          print("ERRORS")
          for code in ("invalid_input", "invalid_mode", "invalid_weights", "product_not_found"):
              print(f"  {code:<18}", int(number("ps_errors_total", error=code)))
          print("OTHER")
          print("  ready (1 = yes)     ", int(float(text.split("\nps_ready ")[1].split()[0])))
          print("  answers in the cache", int(float(text.split("\nps_cache_entries ")[1].split()[0])))

          # Request 1 and the four exact options were new, request 2 and 3 came from the cache.
          assert number("ps_searches_total", mode="exact", cache="hit") == 2
          assert number("ps_searches_total", mode="exact", cache="miss") == 5
          assert number("ps_searches_total", mode="fast", cache="miss") == 1
          assert number("ps_errors_total", error="invalid_input") == 4
          assert number("ps_errors_total", error="invalid_mode") == 1
          assert number("ps_errors_total", error="invalid_weights") == 3
          assert number("ps_errors_total", error="product_not_found") == 1
          assert "\nps_ready 1.0" in text, "the service is not ready"
          assert number("ps_http_requests_total", endpoint="/find_similar_products", status="200") == 2
          assert number("ps_http_requests_total", endpoint="/find_similar_products/details", status="200") == 6
          assert "ps_process_resident_memory_bytes" in text
          print("The counts match what the steps above did.")
          PY
      - name: Container runs as a non-root user
        run: test "$(docker exec ps id -u)" != "0"
      - name: "Scan the image for known vulnerabilities (Trivy, warning only)"
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: product-similarity
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - name: Show logs on failure
        if: failure()
        run: docker logs ps

  kubernetes:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the Kubernetes files against the official schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary k8s/
      - name: Build the image
        run: docker build -t product-similarity:latest .
      - name: Create a test cluster (kind) and load the image into it
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci
      - name: Load the image into the cluster
        run: kind load docker-image product-similarity:latest --name ci
      - name: Deploy - 2 copies, the service and the budget
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/product-similarity --timeout=300s
          kubectl get deployment,pods,service -o wide
      - name: "Both copies are ready (the readiness probe passed)"
        run: |
          ready=$(kubectl get deployment product-similarity -o jsonpath='{.status.readyReplicas}')
          echo "ready copies: $ready"
          test "$ready" = "2"
          kubectl get endpoints product-similarity
      - name: "Search through the service, from inside the cluster"
        run: |
          kubectl run tester --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 3600
          kubectl wait --for=condition=Ready pod/tester --timeout=120s
          kubectl exec tester -- curl -fsS http://product-similarity/ready
          echo
          kubectl exec tester -- curl -fsS "http://product-similarity/find_similar_products/details?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=3" \
            | python3 -c "import json, sys; r = json.load(sys.stdin); assert len(r['results']) == 3, r; print('search through the service works:', [x['title'][:40] for x in r['results']])"
      - name: "One copy is stopped - the other keeps answering (the backup)"
        run: |
          victim=$(kubectl get pods -l app=product-similarity -o jsonpath='{.items[0].metadata.name}')
          echo "stopping $victim"
          kubectl delete pod "$victim" --wait=false
          for i in $(seq 1 20); do
            code=$(kubectl exec tester -- curl -s --retry 3 -o /dev/null -w "%{http_code}" "http://product-similarity/find_similar_products?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=3")
            echo "request $i -> $code"
            test "$code" = "200"
          done
          kubectl rollout status deployment/product-similarity --timeout=300s
          kubectl get pods -l app=product-similarity
      - name: "Rolling update - a change causes no failed request"
        run: |
          cat > load.sh <<'SH'
          i=0; fails=0
          while [ ! -f /tmp/stop ]; do
            i=$((i+1))
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://product-similarity/find_similar_products?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=3")
            [ "$code" = "200" ] || fails=$((fails+1))
            sleep 0.5
          done
          echo "requests=$i failures=$fails" > /tmp/result
          SH
          kubectl cp load.sh tester:/tmp/load.sh
          kubectl exec tester -- rm -f /tmp/stop /tmp/result
          (kubectl exec tester -- sh /tmp/load.sh &) 
          sleep 2
          kubectl set env deployment/product-similarity PS_CACHE_SIZE=2048
          kubectl rollout status deployment/product-similarity --timeout=600s
          kubectl exec tester -- touch /tmp/stop
          sleep 3
          result=$(kubectl exec tester -- cat /tmp/result)
          echo "during the update: $result"
          echo "$result" | grep -q "failures=0"
          kubectl get pods -l app=product-similarity
      - name: "Pod - send the requests straight to ONE pod (it has its own cache)"
        run: |
          pod=$(kubectl get pods -l app=product-similarity -o json | python3 -c "import json, sys; pods = [p for p in json.load(sys.stdin)['items'] if 'deletionTimestamp' not in p['metadata'] and p['status']['phase'] == 'Running']; print(pods[0]['metadata']['name'])")
          echo "all the Pod steps below talk to $pod only"
          nohup kubectl port-forward "pod/$pod" 8000:8000 > portforward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs -m 3 http://localhost:8000/ready > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS -m 5 http://localhost:8000/ready
          echo
          curl -fsS -m 5 http://localhost:8000/cache > cache_before.json
          echo "cache of this pod before the requests: $(cat cache_before.json)"
      - name: "Pod - Request 1 - first time, the answer is searched (cache miss)"
        run: |
          curl -fsS -D headers.txt -o ids.json "http://localhost:8000/find_similar_products?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=5"
          python3 -c "import json; ids = json.load(open('ids.json')); assert len(ids) == 5 and len(set(ids)) == 5, ids; print(ids)"
          grep -i '^x-cache' headers.txt
          grep -qi '^x-cache: miss' headers.txt
          echo "Request 1: X-Cache is miss, as expected for a new question"
      - name: "Pod - Request 2 - same question again, answered from the cache (cache hit)"
        run: |
          curl -fsS -D headers.txt -o ids_again.json "http://localhost:8000/find_similar_products?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=5"
          grep -i '^x-cache' headers.txt
          grep -qi '^x-cache: hit' headers.txt
          cmp ids.json ids_again.json
          echo "Request 2: X-Cache is hit, and the answer is identical to request 1"
      - name: "Pod - Request 3 - same question on the details endpoint (cache hit)"
        run: |
          curl -fsS "http://localhost:8000/find_similar_products/details?product_id=26d41bdc1495de290bc8e6062d927729&num_similar=5" > response.json
          python3 -m json.tool response.json
          python3 -c "
          import json
          r = json.load(open('response.json'))
          assert len(r['results']) == 5 and all(x['title'] for x in r['results'])
          assert r['question']['num_similar'] == 5 and r['response_time_ms'] >= 0
          assert r['cached'] is True
          print('Request 3: cached is', r['cached'], 'and the response time is', r['response_time_ms'], 'ms')
          "
      - name: "Pod - Cache statistics - 2 more hits and 1 more miss"
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          before = json.load(open("cache_before.json"))
          with urllib.request.urlopen("http://localhost:8000/cache") as response:
              after = json.load(response)
          hits = after["hits"] - before["hits"]
          misses = after["misses"] - before["misses"]
          print("before:", before)
          print("after :", after)
          print(f"requests 1-3 gave {hits} hits and {misses} miss")
          assert hits == 2 and misses == 1, (hits, misses)
          PY
      - name: "Pod - Options - one product, five different settings"
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          root = "http://localhost:8000"
          product = "26d41bdc1495de290bc8e6062d927729"
          count = 7  # not 5, so these searches are new and not answers cached by the earlier steps


          def get(path):
              with urllib.request.urlopen(root + path) as response:
                  return json.load(response)


          def search(mode=None, weights=None):
              extra = (f"&mode={mode}" if mode else "") + (f"&weights={weights}" if weights else "")
              return get(f"/find_similar_products/details?product_id={product}&num_similar={count}{extra}")


          ready = get("/ready")
          assert ready["fast_ready"] is True, ready
          tuned = get("/weights")["tuned_weights"]["simple"]
          friendly = {"title": "title", "text_vectors": "sentence", "image": "picture", "attributes": "other attributes"}
          mix = ", ".join(f"{friendly[name]} {value:.0%}" for name, value in tuned.items())

          first = search()
          print("OPTIONS - one product, five different settings")
          print("Product searched:", first["query"]["title"][:90])
          print(f"Each search asks for the {count} most similar products.")
          print("(Not 5, so these are new searches and not answers cached by the steps above.)")

          settings = [
              (
                  "normal search, no extra settings",
                  {},
                  f"exact mode, tuned mix ({mix})",
              ),
              (
                  "same, but fast mode            (mode=fast)",
                  {"mode": "fast"},
                  "the fast index finds the candidates, then the same mix scores them",
              ),
              (
                  "looks only at the picture      (weights=image:1)",
                  {"weights": "image:1"},
                  "only picture similarity counts",
              ),
              (
                  "looks only at the title        (weights=title:1)",
                  {"weights": "title:1"},
                  "only the words of the title count",
              ),
              (
                  "half sentence, half picture    (weights=text_vectors:0.5,image:0.5)",
                  {"weights": "text_vectors:0.5,image:0.5"},
                  "title meaning and picture count equally",
              ),
          ]

          answers = []
          for number, (label, options, meaning) in enumerate(settings, start=1):
              body = first if number == 1 else search(**options)
              answers.append(body)
              kind = "answer from the cache" if body["cached"] else "new search"
              print()
              print(f"SEARCH {number} - {label}")
              print("  What it does :", meaning)
              print(f"  Time         : {body['response_time_ms']} ms   ({kind})")
              for place, item in enumerate(body["results"][:3], start=1):
                  lead = "  Top 3        : " if place == 1 else "                 "
                  print(f"{lead}{place}. {item['title'][:70]}")

          top3 = [[item["id"] for item in body["results"][:3]] for body in answers]
          print()
          print("SUMMARY")
          print(" #  Setting            Mode ran   Time        Top 3 shared with search 1")
          names = ["normal", "fast mode", "picture only", "title only", "sentence+picture"]
          for number, (name, body) in enumerate(zip(names, answers), start=1):
              shared = "-" if number == 1 else f"{len(set(top3[0]) & set(top3[number - 1]))} of 3"
              print(f" {number}  {name:<17}  {body['mode']:<9}  {body['response_time_ms']:>7} ms   {shared}")

          assert answers[1]["mode"] == "fast", answers[1]["mode"]
          ids = [[item["id"] for item in body["results"]] for body in answers]
          assert ids[2] != ids[3] and ids[2] != ids[4] and ids[3] != ids[4], "weights changed nothing"
          print()
          print("CHECKS")
          print(" OK  the fast mode really ran as fast")
          print(" OK  picture only, title only and the mix give 3 different lists")
          print("     -> the weights really change the answer")
          print("Note: the times come from a shared CI machine, so they are only a rough idea.")
          PY
      - name: "Pod - Bad input gives clear errors (422)"
        run: |
          id=26d41bdc1495de290bc8e6062d927729
          check() {
            code=$(curl -s -o body.json -w "%{http_code}" "$1")
            echo "$1 -> $code $(cat body.json)"
            test "$code" = "422"
          }
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=0"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5000"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=many"
          check "http://localhost:8000/find_similar_products?product_id=abc&num_similar=5"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5&mode=turbo"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5&weights=image:2"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5&weights=speed:1"
          check "http://localhost:8000/find_similar_products?product_id=$id&num_similar=5&weights=attributes:0.5,brand:0.5"
      - name: "Pod - Unknown product returns 404"
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/find_similar_products?product_id=00000000000000000000000000000000&num_similar=5")
          test "$code" = "404"
      - name: "Monitoring - check the Prometheus files (promtool) and the cluster files"
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.local.yml
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.55.1 check rules /etc/prometheus/alerts.yml
          kubectl kustomize monitoring/ | ./kubeconform -strict -summary
      - name: "Monitoring - deploy Prometheus and Grafana"
        run: |
          kubectl apply -k monitoring/
          kubectl rollout status deployment/prometheus --timeout=300s
          kubectl rollout status deployment/grafana --timeout=300s
          kubectl get pods
      - name: "Monitoring - send traffic through the service"
        run: |
          id=26d41bdc1495de290bc8e6062d927729
          kubectl exec tester -- sh -c "
            for i in \$(seq 1 40); do
              curl -s -o /dev/null 'http://product-similarity/find_similar_products?product_id=$id&num_similar='\$((i % 8 + 1))'&mode=fast'
              curl -s -o /dev/null 'http://product-similarity/find_similar_products?product_id=$id&num_similar='\$((i % 8 + 1))
            done
            curl -s -o /dev/null 'http://product-similarity/find_similar_products?product_id=$id&num_similar=0'
          "
          echo "sent 81 requests: 40 fast, 40 exact, 1 wrong input"
      - name: "Monitoring - Prometheus reads both pods and the numbers have grown"
        run: |
          for i in $(seq 1 30); do
            kubectl exec tester -- curl -fsS http://prometheus:9090/api/v1/targets > targets.json
            up=$(python3 -c "import json; t = json.load(open('targets.json'))['data']['activeTargets']; print(sum(1 for x in t if x['health'] == 'up' and x['labels'].get('job') == 'product-similarity'))")
            echo "targets up: $up"
            if [ "$up" = "2" ]; then break; fi
            sleep 3
          done
          test "$up" = "2"
          for i in $(seq 1 30); do
            kubectl exec tester -- curl -fsS -G http://prometheus:9090/api/v1/query --data-urlencode 'query=sum(ps_http_requests_total{endpoint="/find_similar_products"})' > query.json
            total=$(python3 -c "import json; r = json.load(open('query.json'))['data']['result']; print(int(float(r[0]['value'][1])) if r else 0)")
            echo "requests Prometheus has counted: $total"
            if [ "$total" -ge 81 ]; then break; fi
            sleep 3
          done
          test "$total" -ge 81
          kubectl exec tester -- curl -fsS http://prometheus:9090/api/v1/rules | python3 -c "import json, sys; names = [r['name'] for g in json.load(sys.stdin)['data']['groups'] for r in g['rules']]; print('alert rules loaded:', names); assert sorted(names) == ['HighErrorRate', 'SlowSearch'], names"
      - name: "Monitoring - Grafana is up and the dashboard is loaded"
        run: |
          kubectl exec tester -- curl -fsS http://grafana:3000/api/health
          echo
          for i in $(seq 1 20); do
            kubectl exec tester -- curl -fsS "http://grafana:3000/api/search?query=Product%20similarity" > dashboards.json
            if grep -q "Product similarity" dashboards.json; then break; fi
            sleep 3
          done
          python3 -c "import json; d = json.load(open('dashboards.json')); print('dashboards found:', [x['title'] for x in d]); assert any(x['title'] == 'Product similarity' for x in d)"
      - name: Show the state of the cluster on failure
        if: failure()
        run: |
          kubectl get all -o wide
          kubectl describe deployment product-similarity
          kubectl logs -l app=product-similarity --tail=50 --prefix
          kubectl logs -l app=prometheus --tail=30 --prefix || true
          kubectl logs -l app=grafana --tail=30 --prefix || true
