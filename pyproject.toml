[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-similarity"
version = "0.1.0"
description = "Multimodal product similarity search for the Amazon Fashion 2020 dataset"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "numpy==2.0.2",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "httpx>=0.28,<1",
    "ruff>=0.17,<0.18",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
]
# Experiment tracking. Not needed to run the service or the tests.
experiments = [
    "mlflow>=2.16,<4",
]
# Pretrained image models (ResNet, CLIP). Offline experiments only, never in the Docker image.
images = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "transformers>=4.40,<5",
]
# Pretrained sentence model for title vectors. Offline experiments only, never in the Docker image.
text = [
    "torch>=2.2,<3",
    "sentence-transformers>=3,<6",
]
# Fast approximate nearest-neighbour search (FAISS, Annoy). Offline experiments only, never in the Docker image.
ann = [
    "faiss-cpu>=1.8,<2",
    "annoy==1.17.1",  # 1.17.2 and 1.17.3 returned only one neighbour on Apple silicon (macOS 26)
]
# Only needed to run the exploration notebooks, never installed in the Docker image.
notebooks = [
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "jupyter>=1.1,<2",
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
"src/product_similarity/review_page.py" = ["E501"]  # long lines inside the HTML template
"experiments/*.py" = ["E501"]  # long report text
