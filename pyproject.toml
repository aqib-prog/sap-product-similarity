[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-similarity"
version = "0.1.0"
description = "Multimodal product similarity search for the Amazon Fashion 2020 dataset"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "numpy==2.0.2",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "httpx>=0.28,<1",
    "ruff>=0.17,<0.18",
]
# Only needed to run the exploration notebooks, never installed in the Docker image.
notebooks = [
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "jupyter>=1.1,<2",
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
