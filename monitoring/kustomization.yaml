# Apply everything with: kubectl apply -k monitoring/
# The Prometheus and Grafana files are turned into ConfigMaps, so the same files are used
# in the cluster and (the dashboard and the alerts) on a laptop.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - prometheus-deployment.yaml
  - grafana-deployment.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
      - alerts.yml
  - name: grafana-datasource
    files:
      - datasource.yml=grafana-datasource.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=grafana-dashboards.yml
  - name: grafana-dashboards
    files:
      - dashboard.json
